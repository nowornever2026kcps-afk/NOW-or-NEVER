<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>3D Chemistry | NOW-or-NEVER</title>

<!-- 3Dmol.js -->
<script src="https://3Dmol.csb.pitt.edu/build/3Dmol-min.js"></script>

<!-- Chemistry 3D CSS -->
<link rel="stylesheet" href="css/chemistry-3d.css">
 

</head>

<body>

 
<main class="chemistry3d-page">

    <!-- Header -->
    <header class="chemistry3d-header">

        <button
            class="back-button"
            onclick="window.location.href='index.html'">
            ← Back
        </button>

        <div>
            <h1>🧬 3D Chemistry</h1>
            <p>
                Explore important Chemistry molecules in interactive 3D.
            </p>
        </div>

    </header>


    <!-- Search -->
           <section class="molecule-search-section">
        
            <input
                type="text"
                id="moleculeSearch"
                placeholder="Search for a molecule..."
                autocomplete="off"
            >
        
            <select id="chapterFilter">
                <option value="all">
                    All Chapters
                </option>
            </select>
        
            <button id="searchMoleculeBtn">
                Search
            </button>
        
        </section>

    <!-- 3D Viewer -->
    <section class="molecule-viewer-section">

        <div class="viewer-header">

            <div>
                <h2 id="moleculeName">
                    Select a molecule
                </h2>

                <p id="moleculeFormula">
                    —
                </p>
            </div>

        </div>


        <div
            id="moleculeViewer"
            class="molecule-viewer">
        </div>


        <!-- Viewer controls -->
        <div class="viewer-controls">

            <button id="ballStickBtn">
                Ball & Stick
            </button>

            <button id="stickBtn">
                Stick
            </button>

            <button id="sphereBtn">
                Spacefill
            </button>

            <button id="resetViewBtn">
                Reset View
            </button>

        </div>

    </section>


    <!-- Molecule Information -->
    <section class="molecule-information">

        <h2>About this molecule</h2>

        <div class="molecule-info-grid">

            <div>
                <span>Chapter</span>
                <strong id="moleculeChapter">—</strong>
            </div>

            <div>
                <span>Topics</span>
                <strong id="moleculeTopics">—</strong>
            </div>

            <div>
                <span>Formula</span>
                <strong id="moleculeInfoFormula">—</strong>
            </div>

            <div>
                <span>PubChem CID</span>
                <strong id="moleculeCID">—</strong>
            </div>

        </div>

    </section>

    <!-- Molecule Library -->
<section class="molecule-library">

    <h2>Molecule Library</h2>

    <div id="moleculeList">
        <!-- Molecule cards will be generated by JavaScript -->
    </div>

</section>

</main>


<!-- Chemistry 3D JavaScript -->
<script src="js/chemistry-3d.js"></script>


</body>

</html>
