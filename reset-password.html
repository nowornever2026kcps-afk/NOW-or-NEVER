
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b0b0b"
    >

    <title>Reset Password — NOW-or-NEVER</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/reset-password.css">
</head>

<body>

    <main class="reset-page">

        <section class="reset-card">

            <!-- Brand -->
            <div class="reset-brand">

                <div class="reset-logo">
                    N
                </div>

                <div>
                    <div class="reset-brand-name">
                        NOW-or-NEVER
                    </div>

                    <div class="reset-brand-subtitle">
                        Your study journey continues.
                    </div>
                </div>

            </div>


            <!-- Main content -->
            <div class="reset-content">

                <div class="reset-icon">
                    🔐
                </div>

                <h1>
                    Create a new password
                </h1>

                <p class="reset-description">
                    Choose a strong password for your
                    NOW-or-NEVER account.
                </p>


                <!-- Password fields -->
                <form id="resetPasswordForm">

                    <div class="reset-field">

                        <label for="newPassword">
                            New password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="newPassword"
                                name="newPassword"
                                placeholder="Enter your new password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleNewPassword"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <div class="reset-field">

                        <label for="confirmPassword">
                            Confirm password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Enter your password again"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleConfirmPassword"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- Password requirements -->
                    <div class="password-requirements">

                        <div
                            class="requirement"
                            id="lengthRequirement"
                        >
                            <span>○</span>
                            At least 8 characters
                        </div>

                        <div
                            class="requirement"
                            id="matchRequirement"
                        >
                            <span>○</span>
                            Passwords match
                        </div>

                    </div>


                    <!-- Status -->
                    <div
                        id="resetStatus"
                        class="reset-status"
                        role="alert"
                        aria-live="polite"
                    ></div>


                    <button
                        type="submit"
                        id="updatePasswordBtn"
                        class="reset-submit"
                    >
                        Update Password
                    </button>

                </form>


                <a
                    href="index.html"
                    class="back-link"
                >
                    ← Back to NOW-or-NEVER
                </a>

            </div>

        </section>


        <p class="reset-footer">
            NOW-or-NEVER · Study smarter. Stay consistent.
        </p>

    </main>


    <script type="module">

        import {
            createClient
        } from
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


        /*
         * ============================================================
         * SUPABASE CONFIG
         * ============================================================
         *
         * IMPORTANT:
         * Use the SAME Supabase URL and ANON/PUBLISHABLE KEY
         * that your existing website uses.
         *
         * DO NOT put your service_role key here.
         */

        const SUPABASE_URL =
            "https://kvbbgvfrllptqpbkixnv.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_YaS6ZJfi4VrAbtGymRBr6w_ocpvX0I-";


        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        /*
         * ============================================================
         * ELEMENTS
         * ============================================================
         */

        const form =
            document.getElementById(
                "resetPasswordForm"
            );

        const newPassword =
            document.getElementById(
                "newPassword"
            );

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );

        const updateButton =
            document.getElementById(
                "updatePasswordBtn"
            );

        const status =
            document.getElementById(
                "resetStatus"
            );

        const lengthRequirement =
            document.getElementById(
                "lengthRequirement"
            );

        const matchRequirement =
            document.getElementById(
                "matchRequirement"
            );


        /*
         * ============================================================
         * STATUS HELPERS
         * ============================================================
         */

        function showStatus(
            message,
            type = ""
        ) {

            status.textContent = message;

            status.className =
                "reset-status";

            if (type) {
                status.classList.add(type);
            }

        }


        /*
         * ============================================================
         * PASSWORD REQUIREMENTS
         * ============================================================
         */

        function updateRequirements() {

            const password =
                newPassword.value;

            const confirmation =
                confirmPassword.value;


            const validLength =
                password.length >= 8;

            const passwordsMatch =
                password.length > 0 &&
                password === confirmation;


            lengthRequirement.classList.toggle(
                "valid",
                validLength
            );

            matchRequirement.classList.toggle(
                "valid",
                passwordsMatch
            );


            lengthRequirement
                .querySelector("span")
                .textContent =
                validLength ? "✓" : "○";


            matchRequirement
                .querySelector("span")
                .textContent =
                passwordsMatch ? "✓" : "○";

        }


        newPassword.addEventListener(
            "input",
            updateRequirements
        );

        confirmPassword.addEventListener(
            "input",
            updateRequirements
        );


        /*
         * ============================================================
         * PASSWORD VISIBILITY
         * ============================================================
         */

        function setupPasswordToggle(
            input,
            button
        ) {

            button.addEventListener(
                "click",
                () => {

                    const showing =
                        input.type === "text";

                    input.type =
                        showing
                            ? "password"
                            : "text";

                    button.textContent =
                        showing
                            ? "Show"
                            : "Hide";

                    button.setAttribute(
                        "aria-label",
                        showing
                            ? "Show password"
                            : "Hide password"
                    );

                }
            );

        }


        setupPasswordToggle(
            newPassword,
            document.getElementById(
                "toggleNewPassword"
            )
        );

        setupPasswordToggle(
            confirmPassword,
            document.getElementById(
                "toggleConfirmPassword"
            )
        );


        /*
         * ============================================================
         * CHECK RECOVERY SESSION
         * ============================================================
         *
         * Supabase creates a recovery session when the user opens
         * the password-reset link.
         */

        let recoverySessionReady = false;


        async function checkRecoverySession() {

            try {

                const {
                    data,
                    error
                } = await supabase.auth.getSession();


                if (error) {

                    console.error(
                        "Recovery session error:",
                        error
                    );

                    showStatus(
                        "This password reset link is invalid or has expired.",
                        "error"
                    );

                    updateButton.disabled = true;

                    return;

                }


                if (!data.session) {

                    showStatus(
                        "This password reset link is invalid or has expired. Please request a new reset email.",
                        "error"
                    );

                    updateButton.disabled = true;

                    return;

                }


                recoverySessionReady = true;

                updateButton.disabled = false;

            }

            catch (error) {

                console.error(
                    "Recovery session check failed:",
                    error
                );

                showStatus(
                    "Unable to verify the reset link.",
                    "error"
                );

                updateButton.disabled = true;

            }

        }


        /*
         * ============================================================
         * PASSWORD UPDATE
         * ============================================================
         */

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const password =
                    newPassword.value.trim();

                const confirmation =
                    confirmPassword.value.trim();


                if (!recoverySessionReady) {

                    showStatus(
                        "Your reset session is not valid. Please request a new reset email.",
                        "error"
                    );

                    return;

                }


                if (password.length < 8) {

                    showStatus(
                        "Your password must contain at least 8 characters.",
                        "error"
                    );

                    newPassword.focus();

                    return;

                }


                if (password !== confirmation) {

                    showStatus(
                        "The passwords do not match.",
                        "error"
                    );

                    confirmPassword.focus();

                    return;

                }


                /*
                 * Prevent accidental double submission.
                 */

                updateButton.disabled = true;

                updateButton.classList.add(
                    "loading"
                );

                updateButton.textContent =
                    "Updating password…";


                try {

                    const {
                        error
                    } = await supabase.auth.updateUser({
                        password: password
                    });


                    if (error) {

                        console.error(
                            "Password update error:",
                            error
                        );

                        showStatus(
                            error.message ||
                            "Unable to update your password.",
                            "error"
                        );

                        updateButton.disabled = false;

                        updateButton.classList.remove(
                            "loading"
                        );

                        updateButton.textContent =
                            "Update Password";

                        return;

                    }


                    /*
                     * Success
                     */

                    showStatus(
                        "Password updated successfully.",
                        "success"
                    );

                    updateButton.textContent =
                        "Password Updated ✓";


                    /*
                     * Give the user a moment to see
                     * the success message.
                     */

                    setTimeout(
                        () => {

                            window.location.href =
                                "index.html";

                        },
                        1500
                    );

                }

                catch (error) {

                    console.error(
                        "Unexpected password reset error:",
                        error
                    );

                    showStatus(
                        "Something went wrong. Please try again.",
                        "error"
                    );

                    updateButton.disabled = false;

                    updateButton.classList.remove(
                        "loading"
                    );

                    updateButton.textContent =
                        "Update Password";

                }

            }
        );


        /*
         * ============================================================
         * START
         * ============================================================
         */

        checkRecoverySession();

    </script>

</body>
</html>
